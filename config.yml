baseURL: "https://www.chrislockard.net/"
title: "🔓 Unl0ckd"
# Without this Hugo falls back to defaultContentLanguage and the feed says
# just "en". Feed readers and validators prefer the region-qualified form.
languageCode: "en-us"
# Must stay nested. As a dotted key ("pagination.PagerSize: 20") YAML makes a
# literal key with a dot in it rather than a nested map, so Hugo never reads it
# and silently falls back to its default of 10 per page.
pagination:
  pagerSize: 20
copyright: "© [Chris Lockard](/contact)"
# Powers the "Related Posts" list in layouts/_partials/extend_post_content.html.
# Tags are weighted far above categories because categories are a closed set of
# five (see CLAUDE.md) -- most posts share a category with dozens of others, so
# it's a weak signal. Tags are the specific, cross-cutting overlap.
related:
  threshold: 60
  includeNewer: true
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 10
theme: ["PaperMod"]
enableRobotsTXT: false
buildDrafts: false
buildFuture: false
buildExpired: false

outputs:
  home:
    - HTML
    - JSON
    - RSS
    - humanstxt

outputFormats:
  humanstxt:
    baseName: humans
    isPlainText: true
    mediaType: text/plain

minify:
  disableXML: true
  minifyOutput: false

params:
  env: production
  title: Unl0ckd
  # Restricts the homepage, archive, and post-nav lists to content/post/. Set
  # explicitly so that adding a section can never change what the homepage shows:
  # left unset, Hugo picks whichever top-level section has the most pages. This
  # is what keeps the retired content/roundup/ posts out of the main flow.
  mainSections:
    - post
  description: "The intersection of Faith, Liberty, Security, Privacy, Technology, and Family"
  # Drives two things: the <image> block in the RSS feed, so readers have an
  # icon and a name to show instead of falling back to the domain, and the
  # site-wide og:image fallback for any page without its own image.
  images:
    - "/images/site-logo-2026.jpg"
  keywords:
    - Blog
    - Portfolio
    - Faith
    - Privacy
    - Security
    - Cyber
    - CyberSecurity
    - Family
    - Liberty
  author:
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  enableGitInfo: true
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowFullTextinRSS: false
  disableSpecial1stPost: false
  # The scroll-to-top button is rendered by layouts/_partials/extend_footer.html
  # and driven by assets/js/scroll-ui.js instead of by the theme. Leaving this
  # true stops PaperMod emitting its own button and its window.onscroll handler,
  # so nothing here depends on how the theme wires up scroll events.
  disableScrollToTop: true
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: true
  ignoreLogs:
    - warning-goldmark-raw-html
  footer:
    text: "Built in the open · [Privacy](/privacy) · [RSS](/index.xml)"
  assets:
    favicon: "/images/icons/favicon.ico"
    favicon16x16: "/images/icons/favicon-16x16.png"
    favicon32x32: "/images/icons/favicon-32x32.png"
    apple_touch_icon: "/images/icons/apple-touch-icon.png"
    safari_pinned_tab: "/images/icons/favicon-32x32.png"
  social:
    twitter: "https://twitter.com/unl0ckd"
    mastodon: "https://defcon.social/@unl0ckd"
    github: "https://github.com/chrislockard"
    matrix: "https://matrix.to/#/@unl0ckd:matrix.org"
    email: "mailto:blog@chrislockard.net"
  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: about
      name: About
      url: /about
      weight: 01
    - identifier: topics
      name: Topics
      url: /topics
      weight: 10
    - identifier: archive
      name: Archive
      url: /archive
      weight: 30
    - identifier: now
      name: Now
      url: /now
      weight: 45
    - identifier: search
      name: Search
      url: /search
      weight: 50

markup:
  goldmark:
    renderer:
      unsafe: true
